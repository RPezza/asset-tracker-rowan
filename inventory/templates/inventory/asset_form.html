{% extends 'inventory/base.html' %}

{% block title %}Asset Form{% endblock %}
{% block page_title %}Asset Form{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

</form>

{% endblock %}
