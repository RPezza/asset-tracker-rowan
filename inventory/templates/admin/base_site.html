{% extends "admin/base.html" %}
{% load static %}

{% block title %}REACH - ASSET TRACKER ADMIN{% endblock %}

{% block extrastyle %}
<style>
    :root {
        color-scheme: Dark;
        --header-bg: #ffffff;
        --header-color: #111111;
        --header-link-color: #111111;
        --header-branding-color: #324e5e;
        --body-bg: #f7f7f7;
        --body-fg: #111111;
        --body-quiet-color: #666666;
        --selected-bg: transparent;
        --selected-row: transparent;
        --darkened-bg: #f7f7f7;
        --accent: #324e5e;
    }
    @media (prefers-color-scheme: dark) { :root { color-scheme: light; } }

    html, body {
        background: var(--body-bg) !important;
        color: var(--body-fg) !important;
        font-family: 'Gamechanger-regular', 'Gamechanger', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif !important;
        margin: 0;
        padding: 0;
    }

    #header {
        background: #e2e2e2 !important;
        color: #111 !important;
        border-bottom: 1px solid #dcdcdc !important;
    }

    #header h1, #site-name {
        color: #111 !important;
    }

    #branding {
        padding: 12px 18px !important;
        margin: 0 !important;
    }

    .admin-branding {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .admin-logo {
        display: inline-block;
        width: 50px;
        height: auto;
        border-radius: 6px;
    }

    .admin-title {
        display: inline-flex;
        flex-direction: column;
        text-align: left;
        color: #192d38 !important;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.05;
    }

    .admin-title span {
        font-size: 20px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #324e5e !important;
    }

    #user-tools a,
    #user-tools button,
    .user-tools a,
    .user-tools button,
    #header .module a,
    #header .module button {
        color: #192d38 !important;
        font-weight: bold;
    }

    #user-tools a:hover,
    #user-tools button:hover,
    .user-tools a:hover,
    .user-tools button:hover {
        color: #028a38 !important;
    }

    .module {
        background: rgba(255,255,255,0.95) !important;
        border: 1px solid #e6e6e6 !important;
        border-radius: 6px !important;
        box-shadow: none !important;
        margin-bottom: 20px;
        overflow: hidden;
    }

    .module h2, .dashboard-module h2 {
        background: #fafafa !important;
        border-bottom: 1px solid #eee !important;
        color: #111 !important;
        padding: 12px 16px !important;
        margin: 0 !important;
        font-size: 14px !important;
        font-weight: 600 !important;
    }

    .addlink, .button, .submit-row input {
        background: #efefef !important;
        color: #111 !important;
        border: 1px solid #ddd !important;
        box-shadow: none !important;
        border-radius: 6px !important;
        padding: 8px 12px !important;
    }

    .addlink:hover, .button:hover, .submit-row input:hover {
        background-color: #e0e0e0 !important;
    }

    .module table th { background: #fafafa !important; color: #111 !important; font-weight: 700 !important; }
    .module table td { color: #111 !important; }

    tbody tr.selected,
    tbody tr.selected td,
    tbody tr.selected th,
    .selected,
    .selected td,
    .selected th,
    .app-list li.selected,
    .app-list li.selected a,
    .app-list li.selected td,
    .app-list li.selected th,
    #content-main .selected,
    #content-main .selected td {
        background-color: transparent !important;
        color: inherit !important;
    }

    form input, form select, form textarea { background: #fff !important; color: #111 !important; border: 1px solid #ddd !important; }

    .dark, .theme-dark, body.dark-mode { background: #f7f7f7 !important; color: #111 !important; }
</style>
{% endblock %}

{% block branding %}
<div class="admin-branding">
    <img src="{% static 'darklogo.png' %}" alt="AtkinsRéalis logo" class="admin-logo" />
    <div class="admin-title">
        <span>REACH</span>
        Asset Tracker Admin
    </div>
</div>
{% endblock %}
