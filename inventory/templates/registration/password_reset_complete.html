{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <link rel="icon" type="image/png" href="{% static 'Atkinsrealis_flavicon_(4) (2).png' %}">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="login-page">
    <div class="login-content">
        <div class="login-box register-box">
            <img src="{% static 'darklong.png' %}" class="login-brand" alt="Reach logo">
            <p class="login-kicker">Asset Booking Portal</p>
            <h2>Password Updated</h2>
            <h3>Your password has been reset successfully.</h3>
            <p class="login-register"><a href="{% url 'login' %}">Sign in now</a></p>
        </div>
    </div>
    <footer>
        <div class="app-footer-brand app-footer-brand-login">
            <img src="{% static 'Atkinsrealis_flavicon_(4) (2).png' %}" alt="AtkinsRealis favicon" class="app-footer-icon">
            <p>&copy; 2025 Reach. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
