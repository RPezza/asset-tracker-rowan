{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link rel="icon" type="image/png" href="{% static 'Atkinsrealis_flavicon_(4) (2).png' %}">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="login-page">
    <div class="login-content">
        <div class="login-box register-box">
            <img src="{% static 'darklong.png' %}" class="login-brand" alt="Reach logo">
            <p class="login-kicker">Asset Booking Portal</p>
            <h2>Set New Password</h2>

            {% if validlink %}
            <h3>Enter your new password below</h3>
            <form method="post" class="login-form register-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="login-submit">Update Password</button>
            </form>
            {% else %}
            <h3>This password reset link is invalid or has expired.</h3>
            <p class="login-register"><a href="{% url 'password_reset' %}">Request a new reset link</a></p>
            {% endif %}
        </div>
    </div>
    <footer>
        <div class="app-footer-brand app-footer-brand-login">
            <img src="{% static 'Atkinsrealis_flavicon_(4) (2).png' %}" alt="AtkinsRealis favicon" class="app-footer-icon">
            <p>&copy; 2025 Reach. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
